<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrollvK — Портфолио артов</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #12100e;
            color: #f3efe6;
            overflow-x: hidden;
        }
        /* Стекло (Glassmorphism) */
        .glass-panel {
            background: rgba(28, 24, 21, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(24, 20, 17, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-4px);
        }
        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #12100e;
        }
        ::-webkit-scrollbar-thumb {
            background: #332b25;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a3e35;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Шапка сайта с баннером -->
    <header id="site-header" class="relative w-full h-80 md:h-96 bg-cover bg-center flex flex-col justify-between p-6 md:p-10 transition-all duration-500" style="background-image: linear-gradient(to bottom, rgba(18,16,14,0.4), rgba(18,16,14,0.95)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop')">
        
        <!-- Навигация верхняя -->
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center z-10">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-extrabold tracking-tight text-white">Krollv</span><span id="logo-k" class="text-2xl font-extrabold text-amber-500">K</span>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Кнопка админки -->
                <button onclick="toggleAdminModal()" class="glass-panel px-4 py-2 rounded-xl text-xs font-semibold tracking-wider uppercase text-amber-400 hover:bg-white/10 transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    Админ-панель
                </button>
                <!-- Выбор тем -->
                <select id="theme-selector" onchange="changeTheme(this.value)" class="glass-panel px-3 py-2 rounded-xl text-xs font-semibold text-white outline-none cursor-pointer">
                    <option value="amber" class="bg-[#181411]">Янтарь (Классика)</option>
                    <option value="emerald" class="bg-[#181411]">Изумруд</option>
                    <option value="cyan" class="bg-[#181411]">Неон Циан</option>
                    <option value="rose" class="bg-[#181411]">Розовый закат</option>
                    <option value="purple" class="bg-[#181411]">Пурпурный</option>
                </select>
            </div>
        </div>

        <!-- Заголовок в шапке -->
        <div class="max-w-7xl mx-auto w-full z-10">
            <h1 id="banner-title" class="text-3xl md:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">Цветные скетчи Тома Фишбаха</h1>
            <p class="text-sm md:text-base text-gray-300 mt-2">Официальная галерея художественных работ и зарисовок</p>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto w-full px-4 md:px-8 py-8 flex-grow">
        
        <!-- Категории (без кнопки "Все") -->
        <div class="flex flex-wrap items-center gap-3 mb-10" id="category-filters">
            <button onclick="filterCategory('colored-sketches')" class="cat-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition bg-amber-500 text-black shadow-lg shadow-amber-500/20" data-cat="colored-sketches">Цветные скетчи</button>
            <button onclick="filterCategory('digital-art')" class="cat-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition glass-panel text-gray-300 hover:text-white" data-cat="digital-art">Цифровые работы</button>
            <button onclick="filterCategory('tom-fischbach')" class="cat-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition glass-panel text-gray-300 hover:text-white" data-cat="tom-fischbach">Покрасы Тома</button>
        </div>

        <!-- Сетка артов -->
        <div id="artworks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400">Загрузка галереи...</div>
        </div>

        <!-- Кнопка "Показать больше" -->
        <div id="load-more-container" class="text-center mt-12 hidden">
            <button onclick="showMoreArtworks()" class="glass-panel px-8 py-3 rounded-xl text-sm font-bold text-white hover:bg-white/10 transition border border-white/10">
                Показать больше
            </button>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="glass-panel border-t border-white/5 py-8 text-center text-xs text-gray-400 mt-20">
        <p>© 2026 KrollvK. Все права защищены.</p>
    </footer>

    <!-- Модальное окно Админ-панели -->
    <div id="admin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="glass-panel w-full max-w-xl rounded-2xl p-6 md:p-8 relative max-h-[90vh] overflow-y-auto border border-white/10">
            <button onclick="toggleAdminModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-xl font-bold">✕</button>
            
            <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Панель администратора
            </h2>

            <!-- Форма входа -->
            <div id="admin-login-section" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Пароль администратора</label>
                    <input type="password" id="admin-pass-input" placeholder="Введите пароль..." class="w-full glass-panel px-4 py-3 rounded-xl text-sm text-white outline-none focus:border-amber-500 transition">
                </div>
                <button onclick="checkAdminPassword()" class="w-full py-3 rounded-xl text-sm font-bold bg-amber-500 text-black hover:bg-amber-400 transition shadow-lg shadow-amber-500/20">Войти в панель</button>
            </div>

            <!-- Управление (скрыто до входа) -->
            <div id="admin-controls-section" class="space-y-6 hidden">
                <div class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/20 text-xs text-amber-300 flex items-center justify-between">
                    <span>Статус: Доступ разрешен</span>
                    <button onclick="logoutAdmin()" class="underline hover:text-white">Выйти</button>
                </div>

                <!-- Загрузка арта -->
                <div class="space-y-3 pt-2 border-t border-white/10">
                    <h3 class="text-sm font-bold text-white">Загрузить новый арт</h3>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Название арта</label>
                        <input type="text" id="new-art-title" class="w-full glass-panel px-4 py-2.5 rounded-xl text-sm text-white outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Категория</label>
                        <select id="new-art-cat" class="w-full glass-panel px-4 py-2.5 rounded-xl text-sm text-white outline-none focus:border-amber-500">
                            <option value="colored-sketches" class="bg-[#181411]">Цветные скетчи</option>
                            <option value="digital-art" class="bg-[#181411]">Цифровые работы</option>
                            <option value="tom-fischbach" class="bg-[#181411]">Покрасы Тома</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Файл изображения</label>
                        <input type="file" id="new-art-file" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-black hover:file:bg-amber-400 cursor-pointer">
                    </div>
                    <button onclick="uploadArtwork()" id="upload-btn" class="w-full py-3 rounded-xl text-sm font-bold bg-amber-500 text-black hover:bg-amber-400 transition shadow-lg shadow-amber-500/20">Загрузить в галерею</button>
                </div>

                <!-- Смена баннера -->
                <div class="space-y-3 pt-4 border-t border-white/10">
                    <h3 class="text-sm font-bold text-white">Изменить шапку сайта</h3>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Заголовок шапки</label>
                        <input type="text" id="new-banner-title" class="w-full glass-panel px-4 py-2.5 rounded-xl text-sm text-white outline-none focus:border-amber-500" placeholder="Новый заголовок...">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Картинка баннера</label>
                        <input type="file" id="new-banner-file" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-black hover:file:bg-amber-400 cursor-pointer">
                    </div>
                    <button onclick="updateBanner()" class="w-full py-3 rounded-xl text-sm font-bold glass-panel text-white hover:bg-white/10 transition border border-white/10">Сохранить баннер</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипты логики -->
    <script>
        const SUPABASE_URL = 'https://xpgbtirhszniznuwvwql.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwZ2J0aXJoc3puaXpudXd2d3FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE5MTY2MjczODJ9.4H4p2r5d8t7v9x3z1m0n2b4v6c8x0z2m4n6b8v0c2';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCategory = 'colored-sketches';
        let allArtworks = [];
        let visibleLimit = 3;
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        const themes = {
            amber: { accent: '#f59e0b' },
            emerald: { accent: '#10b981' },
            cyan: { accent: '#06b6d4' },
            rose: { accent: '#f43f5e' },
            purple: { accent: '#a855f7' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('siteTheme') || 'amber';
            document.getElementById('theme-selector').value = savedTheme;
            changeTheme(savedTheme, false);

            const savedBannerImg = localStorage.getItem('bannerImg');
            const savedBannerText = localStorage.getItem('bannerText');
            if (savedBannerImg) {
                document.getElementById('site-header').style.backgroundImage = `linear-gradient(to bottom, rgba(18,16,14,0.4), rgba(18,16,14,0.95)), url('${savedBannerImg}')`;
            }
            if (savedBannerText) {
                document.getElementById('banner-title').textContent = savedBannerText;
                document.getElementById('new-banner-title').value = savedBannerText;
            }

            fetchArtworks();
        });

        function changeTheme(themeName, save = true) {
            const theme = themes[themeName] || themes.amber;
            document.getElementById('logo-k').style.color = theme.accent;
            document.querySelectorAll('.cat-btn.bg-amber-500').forEach(btn => {
                btn.style.backgroundColor = theme.accent;
            });
            if (save) localStorage.setItem('siteTheme', themeName);
        }

        async function fetchArtworks() {
            const grid = document.getElementById('artworks-grid');
            const { data, error } = await supabase
                .from('artworks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-rose-400">Ошибка загрузки базы данных</div>`;
                return;
            }

            allArtworks = data || [];
            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('artworks-grid');
            const filtered = allArtworks.filter(art => art.category === currentCategory);
            const sliced = filtered.slice(0, visibleLimit);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">В этой категории пока нет артов</div>`;
                document.getElementById('load-more-container').classList.add('hidden');
                return;
            }

            grid.innerHTML = sliced.map(art => `
                <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between group relative">
                    ${isAdmin ? `
                        <button onclick="deleteArtwork('${art.id}')" class="absolute top-3 right-3 z-20 bg-rose-600/90 hover:bg-rose-600 text-white p-2 rounded-xl text-xs shadow-lg transition">
                            Удалить
                        </button>
                    ` : ''}
                    <div class="relative aspect-square overflow-hidden bg-black/40">
                        <img src="${art.image_url}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </div>
                    <div class="p-5 flex flex-col gap-3">
                        <h3 class="font-bold text-white text-lg tracking-tight">${art.title}</h3>
                        <div class="flex items-center justify-between text-xs text-gray-400">
                            <button onclick="likeArtwork('${art.id}')" class="flex items-center gap-1.5 glass-panel px-3 py-1.5 rounded-xl text-rose-500 hover:bg-rose-500/10 transition">
                                ♥ <span>${art.likes || 0}</span>
                            </button>
                            <span class="uppercase tracking-wider text-[10px] text-amber-500/80">${art.category}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            const loadMoreBtn = document.getElementById('load-more-container');
            if (filtered.length > visibleLimit) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            visibleLimit = 3;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition bg-amber-500 text-black shadow-lg shadow-amber-500/20";
                } else {
                    btn.className = "cat-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition glass-panel text-gray-300 hover:text-white";
                }
            });
            renderGallery();
        }

        function showMoreArtworks() {
            visibleLimit += 3;
            renderGallery();
        }

        async function likeArtwork(id) {
            const art = allArtworks.find(a => a.id === id);
            if (!art) return;
            const newLikes = (art.likes || 0) + 1;
            
            art.likes = newLikes;
            renderGallery();

            await supabase
                .from('artworks')
                .update({ likes: newLikes })
                .eq('id', id);
        }

        function toggleAdminModal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            if (isAdmin) {
                document.getElementById('admin-login-section').classList.add('hidden');
                document.getElementById('admin-controls-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-login-section').classList.remove('hidden');
                document.getElementById('admin-controls-section').classList.add('hidden');
            }
        }

        function checkAdminPassword() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === 'LAURATOP25') {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                document.getElementById('admin-login-section').classList.add('hidden');
                document.getElementById('admin-controls-section').classList.remove('hidden');
                renderGallery();
            } else {
                alert('Неверный пароль!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.removeItem('isAdmin');
            toggleAdminModal();
            renderGallery();
        }

        async function uploadArtwork() {
            const title = document.getElementById('new-art-title').value.trim();
            const category = document.getElementById('new-art-cat').value;
            const fileInput = document.getElementById('new-art-file');
            const btn = document.getElementById('upload-btn');

            if (!title || fileInput.files.length === 0) {
                alert('Заполните название и выберите файл изображения!');
                return;
            }

            const file = fileInput.files[0];
            const fileName = `${Date.now()}_${file.name}`;

            btn.textContent = 'Загрузка...';
            btn.disabled = true;

            const { error: uploadError } = await supabase.storage
                .from('artworks')
                .upload(fileName, file);

            if (uploadError) {
                alert('Ошибка загрузки файла в Storage: ' + uploadError.message);
                btn.textContent = 'Загрузить в галерею';
                btn.disabled = false;
                return;
            }

            const { data: publicUrlData } = supabase.storage
                .from('artworks')
                .getPublicUrl(fileName);

            const imageUrl = publicUrlData.publicUrl;

            const { error: dbError } = await supabase
                .from('artworks')
                .insert([{ title, category, image_url: imageUrl, likes: 0 }]);

            if (dbError) {
                alert('Ошибка сохранения в базу данных: ' + dbError.message);
            } else {
                alert('Арт успешно загружен!');
                document.getElementById('new-art-title').value = '';
                fileInput.value = '';
                toggleAdminModal();
                fetchArtworks();
            }

            btn.textContent = 'Загрузить в галерею';
            btn.disabled = false;
        }

        async function deleteArtwork(id) {
            if (!confirm('Вы уверены, что хотите удалить этот арт?')) return;

            const { error } = await supabase
                .from('artworks')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления: ' + error.message);
            } else {
                fetchArtworks();
            }
        }

        async function updateBanner() {
            const titleInput = document.getElementById('new-banner-title').value.trim();
            const fileInput = document.getElementById('new-banner-file');

            if (titleInput) {
                document.getElementById('banner-title').textContent = titleInput;
                localStorage.setItem('bannerText', titleInput);
            }

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileName = `banner_${Date.now()}_${file.name}`;

                const { error } = await supabase.storage
                    .from('artworks')
                    .upload(fileName, file);

                if (error) {
                    alert('Ошибка загрузки баннера: ' + error.message);
                    return;
                }

                const { data: publicUrlData } = supabase.storage
                    .from('artworks')
                    .getPublicUrl(fileName);

                const bannerUrl = publicUrlData.publicUrl;
                document.getElementById('site-header').style.backgroundImage = `linear-gradient(to bottom, rgba(18,16,14,0.4), rgba(18,16,14,0.95)), url('${bannerUrl}')`;
                localStorage.setItem('bannerImg', bannerUrl);
            }

            alert('Шапка сайта обновлена!');
            toggleAdminModal();
        }
    </script>
</body>
</html>
