<!DOCTYPE html>
<html lang="ru" data-theme="laura-classic" data-glass="off" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrollvK — Artist Portfolio</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            theme: {
              accent: 'var(--color-accent)',
              accentGlow: 'var(--color-accent-glow)',
              bg: 'var(--color-bg)',
              card: 'var(--color-card)',
              text: 'var(--color-text)',
              border: 'var(--color-border)',
            }
          }
        }
      }
    }

      --color-card: #281219;
      --color-text: #fbf1f2;
      --color-border: rgba(239, 68, 68, 0.25);

    :root[data-theme="laura-autumn"] {

      color: var(--color-text);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-theme-accent { background-color: var(--color-accent); }
    .text-theme-accent { color: var(--color-accent); }
    .border-theme-accent { border-color: var(--color-accent); }
    .bg-theme-card { background-color: var(--color-card); }
    .border-theme-custom { border-color: var(--color-border); }

    .glow-effect {
      text-shadow: 0 0 25px var(--color-accent-glow), 0 0 45px var(--color-accent);

    .box-glow {

    html {
      scroll-behavior: smooth;

    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;

</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-orange-500 selection:text-white">

    </div>

      </div>
      
      <div class="absolute bottom-4 sm:bottom-6 left-4 sm:left-6 right-4 sm:right-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>

            <span id="bannerBadge">✨ Latest Tom Fischbach sketch color</span>

          <h1 id="bannerTitle" class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight drop-shadow-md">
            Галерея работ KrollvK

        </div>
      </div>
    </section>

    <!-- GALLERY SECTION -->
    <section class="space-y-6">
      
      <!-- CATEGORY TABS (DEFAULT: COLORED SKETCHES, NO ALL BUTTON) -->
      <div class="flex items-center justify-between border-b border-white/5 pb-4 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 sm:gap-3" id="categoryContainer">
          <button onclick="setCategory('Цветные скетчи')" id="cat-Colored" class="category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap bg-theme-accent text-black shadow-lg">

          <button onclick="setCategory('Цифровые работы')" id="cat-Digital" class="category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5">

          <button onclick="setCategory('Покрасы Тома')" id="cat-Tom" class="category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5">
            Покрасы Тома
          </button>
        </div>
      </div>

      <!-- ARTWORK CARDS GRID -->
      <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">

      </div>

      <!-- SHOW MORE BUTTON -->
      <div id="showMoreContainer" class="flex justify-center pt-6 hidden">
        <button onclick="toggleShowAll()" id="showMoreBtn" class="px-8 py-3 rounded-2xl border border-theme-custom bg-theme-card hover:bg-theme-accent hover:text-black text-theme-accent text-sm font-bold transition duration-300 flex items-center gap-2 shadow-xl box-glow">

  <!-- FOOTER -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-400">
      <div class="flex items-center gap-2">
        <span class="font-bold text-white">Krollv<span class="text-theme-accent">K</span></span>
        <span>© 2026. Styled with Laura (Twokinds) theme.</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="https://deviantart.com" target="_blank" rel="noopener" class="hover:text-theme-accent transition"><i class="fa-brands fa-deviantart text-sm"></i> DeviantArt</a>
        <a href="https://github.com/krollvak615-cmd/krollvk.github.io" target="_blank" rel="noopener" class="hover:text-theme-accent transition"><i class="fa-brands fa-github text-sm"></i> GitHub</a>
      </div>
    </div>
  </footer>

  <!-- ADMIN MODAL -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-theme-card border border-theme-custom glass-card rounded-3xl max-w-lg w-full p-6 shadow-2xl relative space-y-6">
      
      <!-- Close Button -->
      <button onclick="closeAdminModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-lg transition">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- AUTH FORM (NO PASSWORD HINT) -->
      <div id="adminAuthView" class="space-y-4">
        <div class="text-center space-y-1">
          <div class="w-12 h-12 rounded-2xl bg-theme-accent/20 border border-theme-accent/40 text-theme-accent flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h3 class="text-xl font-bold text-white">Панель управления</h3>

        </div>

        <form onsubmit="handleAdminAuth(event)" class="space-y-4">
          <input type="password" id="adminPasswordInput" placeholder="Введите пароль..." required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-theme-accent transition">
          <button type="submit" class="w-full py-3 bg-theme-accent text-black font-bold rounded-xl text-sm transition hover:opacity-90 shadow-lg">
            Войти в систему
          </button>
        </form>
      </div>

      <!-- ADMIN DASHBOARD (VISIBLE ONCE LOGGED IN) -->
      <div id="adminDashboardView" class="hidden space-y-6 max-h-[75vh] overflow-y-auto pr-1 no-scrollbar">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <div>
            <span class="text-xs text-theme-accent font-bold uppercase tracking-wider">Администратор</span>
            <h3 class="text-lg font-bold text-white">Управление сайтом</h3>

          <button onclick="adminLogout()" class="px-3 py-1.5 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold hover:bg-red-500/20 transition">

        <!-- 1. BANNER CUSTOMIZATION -->
        <div class="space-y-3 pb-4 border-b border-white/10">
          <label class="block text-xs font-bold uppercase tracking-wider text-theme-accent">1. Смена баннера шапки</label>
          <div class="space-y-3 text-xs">
            <input type="text" id="adminBannerText" placeholder="Подпись баннера (напр. ✨ Latest Tom Fischbach sketch color)" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-white">

            <button onclick="setTheme('laura-autumn')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-amber-600 text-left flex items-center justify-between">

            </button>
            <button onclick="setTheme('laura-snow')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-sky-400 text-left flex items-center justify-between">

              <span class="w-3 h-3 rounded-full bg-cyan-400"></span>
            </button>
            <button onclick="setTheme('emerald')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-emerald-500 text-left flex items-center justify-between">
              <span>Emerald</span>
              <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            </button>
            <button onclick="setTheme('amethyst')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-purple-500 text-left flex items-center justify-between">

              <span class="w-3 h-3 rounded-full bg-purple-500"></span>
            </button>
            <button onclick="setTheme('midnight')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-indigo-500 text-left flex items-center justify-between">

            <button onclick="setTheme('sakura')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-pink-500 text-left flex items-center justify-between">

              <span class="w-3 h-3 rounded-full bg-pink-500"></span>
            </button>
            <button onclick="setTheme('gold')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-yellow-400 text-left flex items-center justify-between">

              <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
            </button>
            <button onclick="setTheme('monochrome')" class="p-2 rounded-xl border border-white/10 bg-black/40 hover:border-gray-300 text-left flex items-center justify-between">

              <span class="w-3 h-3 rounded-full bg-gray-300"></span>

          <!-- Glassmorphism Toggle -->

        </div>
      </div>

      console.warn("Supabase SDK initialization warning:", err);
    }

    // --- MOCK LOCAL DATA ---
    let artworksData = [
      {
        id: 1,
        title: "Laura Leash",
        category: "Цветные скетчи",
        image_url: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80",
        likes: 24
      },
      {
        id: 2,
        title: "Seasons of Laura (Summer/Winter)",
        category: "Цветные скетчи",
        image_url: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80",
        likes: 43
      },
      {
        id: 3,
        title: "Tribal Dancing Fox",
        category: "Цветные скетчи",
        image_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
        likes: 58
      },
      {
        id: 4,
        title: "Laura Warm Autumn Glow",
        category: "Цветные скетчи",
        image_url: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80",
        likes: 31
      },
      {
        id: 5,
        title: "Keidran Portrait Digital",
        category: "Цифровые работы",
        image_url: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=800&q=80",
        likes: 89
      },
      {
        id: 6,
        title: "Tom Fischbach Lineart Color",
        category: "Покрасы Тома",
        image_url: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=800&q=80",
        likes: 112
      }
    ];

    // APP STATE VARIABLES
    let currentCategory = "Цветные скетчи";
    let showAllArtworks = false;
    let isAdminLoggedIn = false;

    // --- APP INITIALIZATION ---
    window.onload = function() {
      // Restore theme & glass state from localStorage
      const savedTheme = localStorage.getItem('krollvk_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      const savedGlass = localStorage.getItem('krollvk_glass');
      if (savedGlass) {
        document.documentElement.setAttribute('data-glass', savedGlass);
        updateGlassBtnUI(savedGlass);
      }

      // Restore custom banner from localStorage
      const savedBannerImg = localStorage.getItem('krollvk_banner_url');
      if (savedBannerImg) {
        const el = document.getElementById('bannerImg');
        if (el) el.src = savedBannerImg;
      }
      const savedBannerTitle = localStorage.getItem('krollvk_banner_title');
      if (savedBannerTitle) {
        const el = document.getElementById('bannerBadge');
        if (el) el.innerText = savedBannerTitle;
      }

      // Intro overlay transition
      const intro = document.getElementById('introOverlay');
      setTimeout(() => {
        if (intro) {
          intro.classList.add('opacity-0');
          setTimeout(() => intro.style.display = 'none', 500);
        }
      }, 1000);

      // Fetch dynamic content
      fetchArtworksFromSupabase();
    };

    // --- SUPABASE DATABASE FETCH ---
    async function fetchArtworksFromSupabase() {
      if (!supabaseClient) {
        renderGallery();
        return;
      }
      try {
        const { data, error } = await supabaseClient
          .from('artworks')
          .select('*')
          .order('id', { ascending: false });

        if (!error && data && data.length > 0) {
          artworksData = data;
        }
      } catch (err) {
        console.warn("Using fallback local data due to Supabase query response:", err);
      }
      renderGallery();
    }

    // --- GALLERY RENDER LOGIC ---
    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const showMoreContainer = document.getElementById('showMoreContainer');
      const showMoreBtn = document.getElementById('showMoreBtn');

      // Filter by active category
      const filtered = artworksData.filter(art => art.category === currentCategory);

      // Limit pagination
      const limit = showAllArtworks ? filtered.length : 3;
      const visibleArtworks = filtered.slice(0, limit);

      grid.innerHTML = "";

      if (visibleArtworks.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 space-y-3">
            <i class="fa-solid fa-box-open text-4xl"></i>
            <p class="text-sm font-medium">В этой категории пока нет работ.</p>
          </div>
        `;
        showMoreContainer.classList.add('hidden');
        return;
      }

      visibleArtworks.forEach(art => {
        const card = document.createElement('div');
        card.className = "group relative rounded-3xl overflow-hidden border border-theme-custom bg-theme-card glass-card shadow-xl transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl flex flex-col";

        card.innerHTML = `
          <div class="relative aspect-4/3 w-full overflow-hidden bg-black/40">
            <img src="${art.image_url}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/800x600/1c1411/f97316?text=${encodeURIComponent(art.title)}'">
            
            ${isAdminLoggedIn ? `
              <button onclick="deleteArtwork(${art.id})" title="Удалить арт" class="absolute top-3 right-3 z-20 w-9 h-9 rounded-xl bg-red-600/90 hover:bg-red-500 text-white flex items-center justify-center shadow-lg transition backdrop-blur-sm">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            ` : ''}
          </div>

          <div class="p-5 flex flex-col justify-between flex-grow space-y-4">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-theme-accent">${art.category}</span>
              <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-theme-accent transition line-clamp-1">${art.title}</h3>
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-white/5">
              <button onclick="likeArtwork(${art.id})" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border border-white/10 bg-black/30 hover:border-theme-accent hover:text-theme-accent text-xs font-semibold text-gray-300 transition group/like">
                <i class="fa-solid fa-heart text-red-500 group-hover/like:scale-125 transition duration-200"></i>
                <span id="likes-count-${art.id}">${art.likes || 0}</span>
              </button>

              <span class="text-[11px] text-gray-500 font-medium">KrollvK Art</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length > 3) {
        showMoreContainer.classList.remove('hidden');
        showMoreBtn.innerHTML = showAllArtworks 
          ? `<span>Скрыть часть</span> <i class="fa-solid fa-chevron-up"></i>` 
          : `<span>Показать больше (${filtered.length - 3})</span> <i class="fa-solid fa-chevron-down"></i>`;
      } else {
        showMoreContainer.classList.add('hidden');
      }
    }

    // --- CATEGORY SWITCHER ---
    function setCategory(catName) {
      currentCategory = catName;
      showAllArtworks = false;

      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = "category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-gray-400 hover:text-white hover:bg-white/5";
      });

      if (catName === 'Цветные скетчи') {
        document.getElementById('cat-Colored').className = "category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap bg-theme-accent text-black shadow-lg";
      } else if (catName === 'Цифровые работы') {
        document.getElementById('cat-Digital').className = "category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap bg-theme-accent text-black shadow-lg";
      } else if (catName === 'Покрасы Тома') {
        document.getElementById('cat-Tom').className = "category-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap bg-theme-accent text-black shadow-lg";
      }

      renderGallery();
    }

    function toggleShowAll() {
      showAllArtworks = !showAllArtworks;
      renderGallery();
    }

    // --- DIRECT LIKES INCREMENT IN SUPABASE DATABASE ---
    async function likeArtwork(id) {
      const art = artworksData.find(a => a.id === id);
      if (!art) return;

      const newLikesCount = (art.likes || 0) + 1;
      art.likes = newLikesCount;

      const countEl = document.getElementById(`likes-count-${id}`);
      if (countEl) countEl.innerText = newLikesCount;

      showToast("Спасибо за лайк! ❤️");

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('artworks')
            .update({ likes: newLikesCount })
            .eq('id', id);

          if (error) {
            console.warn("Supabase like update error:", error);
          }
        } catch (err) {
          console.warn("Likes operation failed:", err);
        }
      }
    }

    // --- ADMIN AUTHENTICATION ---
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function handleAdminAuth(e) {
      e.preventDefault();
      const pwd = document.getElementById('adminPasswordInput').value;

      if (pwd === "LAURATOP25") {
        isAdminLoggedIn = true;
        document.getElementById('adminAuthView').classList.add('hidden');
        document.getElementById('adminDashboardView').classList.remove('hidden');
        document.getElementById('adminPasswordInput').value = "";
        showToast("Успешный вход в админку!");
        renderGallery();
      } else {
        showToast("Неверный пароль!", true);
      }
    }

    function adminLogout() {
      isAdminLoggedIn = false;
      document.getElementById('adminAuthView').classList.remove('hidden');
      document.getElementById('adminDashboardView').classList.add('hidden');
      closeAdminModal();
      renderGallery();
      showToast("Вы вышли из админ-панели");
    }

    // --- DELETE ARTWORK DIRECTLY ---
    async function deleteArtwork(id) {
      if (!confirm("Вы уверены, что хотите удалить этот арт из базы?")) return;

      artworksData = artworksData.filter(a => a.id !== id);
      renderGallery();
      showToast("Арт успешно удален");

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('artworks')
            .delete()
            .eq('id', id);
        } catch (err) {
          console.warn("Database deletion failed:", err);
        }
      }
    }

    // --- UPLOAD NEW ARTWORK VIA FILE PICKER ---
    async function addNewArt() {
      const title = document.getElementById('artTitle').value.trim();
      const category = document.getElementById('artCategory').value;
      const fileInput = document.getElementById('artFile');

      if (!title) {
        showToast("Введите название арта!", true);
        return;
      }

      let imageUrl = "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80";

      if (fileInput.files && fileInput.files[0] && supabaseClient) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;
        
        try {
          const { data, error } = await supabaseClient.storage
            .from('artworks')
            .upload(fileName, file);

          if (!error && data) {
            const { data: publicUrlData } = supabaseClient.storage
              .from('artworks')
              .getPublicUrl(fileName);
            
            if (publicUrlData && publicUrlData.publicUrl) {
              imageUrl = publicUrlData.publicUrl;
            }
          }
        } catch (err) {
          console.warn("Storage upload fallback error:", err);
        }
      } else if (fileInput.files && fileInput.files[0]) {
        imageUrl = URL.createObjectURL(fileInput.files[0]);
      }

      const newArt = {
        id: Date.now(),
        title,
        category,
        image_url: imageUrl,
        likes: 0
      };

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('artworks')
            .insert([{ title, category, image_url: imageUrl, likes: 0 }])
            .select();

          if (!error && data && data[0]) {
            newArt.id = data[0].id;
          }
        } catch (err) {
          console.warn("Table insert error:", err);
        }
      }

      artworksData.unshift(newArt);
      currentCategory = category;
      setCategory(category);
      showToast("Новый арт успешно опубликован!");
      
      document.getElementById('artTitle').value = "";
      fileInput.value = "";
      closeAdminModal();
    }

    // --- UPLOAD BANNER & UPDATE TITLE ---
    async function updateBanner() {
      const bannerText = document.getElementById('adminBannerText').value.trim();
      const fileInput = document.getElementById('adminBannerFile');
      const bannerImg = document.getElementById('bannerImg');
      const bannerBadge = document.getElementById('bannerBadge');

      if (bannerText && bannerBadge) {
        bannerBadge.innerText = bannerText;
        localStorage.setItem('krollvk_banner_title', bannerText);
      }

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        let imageUrl = URL.createObjectURL(file);

        if (supabaseClient) {
          try {
            const fileName = `banner_${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage
              .from('artworks')
              .upload(fileName, file);

            if (!error && data) {
              const { data: publicUrlData } = supabaseClient.storage
                .from('artworks')
                .getPublicUrl(fileName);

              if (publicUrlData && publicUrlData.publicUrl) {
                imageUrl = publicUrlData.publicUrl;
              }
            }
          } catch(err) {
            console.warn("Banner upload error:", err);
          }
        }
        if (bannerImg) {
          bannerImg.src = imageUrl;
          localStorage.setItem('krollvk_banner_url', imageUrl);
        }
      }

      showToast("Баннер успешно обновлен!");
      closeAdminModal();
    }

    // --- THEME & GLASSMORPHISM SWITCHER WITH LOCALSTORAGE ---
    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('krollvk_theme', themeName);
      showToast(`Тема изменена: ${themeName}`);
    }

    function toggleGlass() {
      const current = document.documentElement.getAttribute('data-glass');
      const next = current === 'on' ? 'off' : 'on';
      document.documentElement.setAttribute('data-glass', next);
      localStorage.setItem('krollvk_glass', next);
      updateGlassBtnUI(next);
    }

    function updateGlassBtnUI(state) {
      const btn = document.getElementById('glassToggleBtn');
      if (btn) {
        btn.innerText = state === 'on' ? 'ВКЛ' : 'ВЫКЛ';
        btn.className = state === 'on' 
          ? 'px-3 py-1.5 rounded-lg border border-theme-accent bg-theme-accent text-black font-bold transition shadow-md' 
          : 'px-3 py-1.5 rounded-lg border border-white/10 bg-black/40 font-bold text-gray-400 transition';
      }
    }

    // --- UI TOAST HELPER ---
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      if (isError) {
        toastIcon.className = "fa-solid fa-circle-exclamation text-red-500 text-lg";
      } else {
        toastIcon.className = "fa-solid fa-circle-check text-theme-accent text-lg";
      }

      toast.classList.remove('translate-x-full');
      setTimeout(() => {
        toast.classList.add('translate-x-full');
      }, 3000);
    }
  </script>
</body>
</html>
